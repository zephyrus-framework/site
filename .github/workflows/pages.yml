name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  LEAF_VERSION: v1.0.0
  APP_ENV: production
  APP_DEBUG: 'false'

jobs:
  build:
    name: Build with Leaf
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, intl, mbstring, sodium, pdo
          coverage: none

      - name: Install pinned Leaf release
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/zephyrus-framework/leaf-cli/releases/download/${LEAF_VERSION}/leaf-linux-amd64" \
            --output "$RUNNER_TEMP/leaf"
          printf '%s  %s\n' \
            '06f75047b74bc05f030bc683674d141e95599379a1996a1d55d7ad347b9c5a2b' \
            "$RUNNER_TEMP/leaf" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/leaf"
          "$RUNNER_TEMP/leaf" version

      - name: Build the bilingual site
        run: |
          "$RUNNER_TEMP/leaf" build
          test -s dist/index.html
          test -s dist/fr/index.html
          test -s dist/404.html
          test -s dist/fr/404.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/assets/images/og.png
          test -s dist/assets/images/og-fr.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
